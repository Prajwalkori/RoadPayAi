{% extends "base.html" %}

{% block title %}Sign In - RoadPay AI{% endblock %}

{% block layout %}
<div class="auth-wrapper bg-dot-pattern">
    <!-- Ambient Gradients -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-container">
        <!-- Back and Toggle Row -->
        <div class="auth-header-bar">
            <a href="/" class="auth-back-link">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                <span>Back to Home</span>
            </a>
            
            <button onclick="toggleTheme()" class="btn-icon" title="Toggle Theme">
                <i data-lucide="sun" class="light-icon" style="display: none; width: 14px; height: 14px;"></i>
                <i data-lucide="moon" class="dark-icon" style="display: none; width: 14px; height: 14px;"></i>
            </button>
        </div>

        <!-- Sleek Form Card -->
        <div class="glass-panel" style="padding: 32px; background: rgba(255,255,255,0.75); border-radius: 28px;">
            <div style="text-align: center; margin-bottom: 24px;">
                <span style="font-size: 20px; font-weight: 800; color: var(--text-primary);">
                    Sign In to <span style="background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">RoadPay AI</span>
                </span>
                <p style="font-size: 11px; color: var(--text-secondary); mt-6px; font-weight: 600;">Access your citizen or officer safety dashboard</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="alert-box alert-danger" style="display: none; margin-bottom: 20px;">
                <i data-lucide="shield-alert"></i>
                <span id="error-message"></span>
            </div>

            <!-- Segmented Role Selector -->
            <div class="segmented-control" style="margin-bottom: 24px;">
                <button onclick="selectRole('OWNER', this)" class="segment-btn active role-owner">Citizen</button>
                <button onclick="selectRole('OFFICER', this)" class="segment-btn role-officer">Officer</button>
                <button onclick="selectRole('ADMIN', this)" class="segment-btn role-admin">Admin</button>
                <button onclick="selectRole('CUSTOM', this)" class="segment-btn">Custom</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y" style="display: flex; flex-direction: column; gap: 20px;">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" placeholder="name@roadpay.ai" required class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required class="form-input">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-card btn-card-primary" style="font-size: 11px; font-weight: 700; width: 100%; padding: 14px;">
                    Sign In to Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; font-size: 12px; font-weight: 600; color: var(--text-secondary);">
                <span>New vehicle owner? </span>
                <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 700;">Create citizen account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Selected role handler
    let selectedRole = "OWNER";
    
    // Automatically pre-fill Citizen Owner by default
    document.addEventListener("DOMContentLoaded", () => {
        selectRole("OWNER", document.querySelector(".role-owner"));
    });

    function selectRole(role, btn) {
        selectedRole = role;
        
        // Remove active class from all buttons
        document.querySelectorAll(".segment-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        
        const emailInput = document.getElementById("email");
        const passInput = document.getElementById("password");
        
        if (role === "ADMIN") {
            emailInput.value = "admin@roadpay.ai";
            passInput.value = "admin123";
        } else if (role === "OFFICER") {
            emailInput.value = "officer@roadpay.ai";
            passInput.value = "officer123";
        } else if (role === "OWNER") {
            emailInput.value = "owner@roadpay.ai";
            passInput.value = "owner123";
        } else {
            emailInput.value = "";
            passInput.value = "";
            emailInput.focus();
        }
    }

    // Submit handler
    const form = document.getElementById("login-form");
    const errorBanner = document.getElementById("error-banner");
    const errorMessage = document.getElementById("error-message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBanner.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.innerText = "Authenticating...";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            // Call login REST API
            const data = await apiRequest("/api/auth/login", {
                method: "POST",
                body: JSON.stringify({ email, password })
            });

            // Save access_token inside standard cookie
            setCookie("access_token", data.access_token, 1);
            
            // Redirect to dashboard overview
            window.location.href = "/dashboard";
        } catch (error) {
            errorMessage.innerText = error.message || "Authentication failed. Check credentials.";
            errorBanner.style.display = "flex";
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign In to Account";
        }
    });
</script>
{% endblock %}
